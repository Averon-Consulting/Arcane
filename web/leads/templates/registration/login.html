<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.4 Georgia, serif;
      background: #f7f4ef;
      color: #1c1915;
    }
    form {
      width: min(360px, calc(100% - 32px));
      background: #fffdf9;
      border: 1px solid #e4ddd2;
      border-radius: 12px;
      padding: 24px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #5e584f; }
    label { display: block; margin: 12px 0; font: 13px/1.2 ui-sans-serif, system-ui, sans-serif; }
    input {
      display: block;
      width: 100%;
      margin-top: 4px;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #e4ddd2;
      border-radius: 8px;
      font: 15px/1.2 ui-sans-serif, system-ui, sans-serif;
    }
    button {
      margin-top: 8px;
      background: #1f4b3a;
      color: white;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      font: 14px/1.2 ui-sans-serif, system-ui, sans-serif;
    }
    .error { color: #8a2b1f; font: 14px/1.3 ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>Alberta medical leads</h1>
    <p>Sign in to see the Edmonton list.</p>
    {% if form.errors %}
      <p class="error">That username and password did not match.</p>
    {% endif %}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
